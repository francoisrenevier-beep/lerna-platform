<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 80" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="29" y1="58" x2="63" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2D5B"/>
      <stop offset="100%" stop-color="#3DBFA0"/>
    </linearGradient>
  </defs>

  <!-- Bracket ( [ shape, 3 sides open right ) -->
  <path d="M12 12 L12 68 L54 68" stroke="#1B2D5B" stroke-width="7.5" stroke-linecap="square" fill="none"/>
  <path d="M12 12 L54 12"        stroke="#1B2D5B" stroke-width="7.5" stroke-linecap="square" fill="none"/>

  <!-- Diagonal line with gradient -->
  <line x1="29" y1="58" x2="63" y2="12" stroke="url(#lineGrad)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Bottom dot — navy -->
  <circle cx="29" cy="58" r="8" fill="#1B2D5B"/>

  <!-- Top dot — teal (outside bracket, upper right) -->
  <circle cx="63" cy="11" r="11" fill="#3DBFA0"/>

  <!-- LERNA wordmark -->
  <text
    x="85" y="59"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="52"
    fill="#1B2D5B"
    letter-spacing="2"
  >LERNA</text>

  <!-- Teal accent bar under the A (bottom-right of wordmark) -->
  <rect x="289" y="63" width="28" height="5" rx="1" fill="#3DBFA0"/>
</svg>
